[project]
name = "finalproject_kistin_m26_555"
version = "0.1.0"
description = "Учебный валютный кошелёк ValutaTrade Hub"
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "Кистин Захар"}]
dependencies = ["prettytable>=3.12,<4", "requests>=2.32,<3"]

[project.urls]
Repository = "https://github.com/MarchiYT/final-project_Kistin_M26-555"

[project.scripts]
project = "main:main"

[dependency-groups]
dev = ["ruff>=0.12,<1"]

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["valutatrade_hub", "main.py"]

[tool.hatch.build.targets.sdist]
include = ["valutatrade_hub", "main.py", "pyproject.toml", "uv.lock", "README.md", "Makefile", "data", "demo.cast", "demo.svg", "tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.valutatrade]
data_dir = "data"
logs_dir = "logs"
rates_ttl_seconds = 300
default_base_currency = "USD"
log_level = "INFO"
log_format = "%(asctime)s %(levelname)s %(message)s"
