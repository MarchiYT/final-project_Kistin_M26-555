<text x="16" y="349">&gt; sell --currency EUR --amount 1000</text>
<text x="16" y="368">Недостаточно средств: доступно 75 EUR, требуется 1000 EUR</text>
<text x="16" y="387">&gt; get-rate --from ABC --to USD</text>
